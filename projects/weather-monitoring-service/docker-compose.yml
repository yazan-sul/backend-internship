services:
  db:
    image: postgres:18-alpine
    container_name: weather-monitoring-service-db
    environment:
      POSTGRES_DB: weather_monitoring_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - weather-monitoring-service-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d weather_monitoring_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: weather-monitoring-service-backend
    build: ./backend
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=db;Port=5432;Database=weather_monitoring_service;Username=postgres;Password=postgres
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: weather-monitoring-service-frontend
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  weather-monitoring-service-data:
