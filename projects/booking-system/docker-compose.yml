services:
  backend:
    build: ./backend
    image: booking-system-backend:latest
    container_name: booking-system-backend
    environment:
      ASPNETCORE_URLS: http://+:8080
      Booking__DataDirectory: /app/data
    ports: ["5080:8080"]
    volumes: ["./data:/app/data"]
  frontend:
    build: ./frontend
    image: booking-system-frontend:latest
    container_name: booking-system-frontend
    ports: ["5173:5173"]
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    depends_on: [backend]
