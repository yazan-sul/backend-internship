services:
  db:
    image: postgres:18-alpine
    container_name: project-template-db
    environment:
      POSTGRES_DB: project_template
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - project-template-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_template"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    container_name: project-template-backend
    build: ./backend
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Database: Host=db;Port=5432;Database=project_template;Username=postgres;Password=postgres
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    container_name: project-template-frontend
    build: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  project-template-data:
